[package]
name = "tank-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Validated ingestion, graph construction, queries, and benchmarks for Tank Graph"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "cargo"] }
icu_casemap = "2"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
